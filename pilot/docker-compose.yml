# Fizibilite pilotu: HAPI FHIR (R4) + PostgreSQL
# Compose proje adı "ym-pilot": temizlikte yalnız bu projenin kaynakları silinir.
# Port yalnız localhost'a açık.
name: ym-pilot

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi-pilot-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 5s
      timeout: 5s
      retries: 30

  hapi:
    image: hapiproject/hapi:latest   # v8.10.0-3 (pilot başında yerelde mevcut)
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      spring.datasource.url: "jdbc:postgresql://db:5432/hapi"
      spring.datasource.username: "hapi"
      spring.datasource.password: "hapi-pilot-only"
      spring.datasource.driverClassName: "org.postgresql.Driver"
      spring.jpa.properties.hibernate.dialect: "ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect"
      hapi.fhir.fhir_version: "R4"
      JAVA_TOOL_OPTIONS: "-Xmx3g"

volumes:
  pgdata:
